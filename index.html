<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xanadu</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="layout">

<aside class="sidebar">
  <h1 class="brand">Xanadu</h1>
  <input id="search" placeholder="Buscar...">
</aside>

<main class="main">
  <header class="hero">
    <h2 id="title">Biblioteca</h2>
    <div id="count">0</div>
  </header>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty">No hay ítems</div>
</main>

</div>

<button id="add">＋</button>

<div id="form" class="overlay hidden">
  <div class="modal">
    <input id="t" placeholder="Título">
    <input id="a" placeholder="Autor">
    <button id="save">Guardar</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
