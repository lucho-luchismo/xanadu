<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xanadu</title>
<style>
body{margin:0;font-family:Georgia,serif;background:#efe2cf;color:#412d20}
.app{display:flex}
.sidebar{width:260px;padding:20px;background:#f6ecdd;height:100vh}
.main{flex:1;padding:20px}
.card{background:#fbf4e8;border-radius:16px;padding:12px;margin-bottom:12px;cursor:pointer}
.badge{font-size:12px;opacity:.7}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
<h2>Xanadu</h2>
<input placeholder="Buscar..." style="width:100%;margin-bottom:10px">
<button onclick="setView('Biblioteca')">Biblioteca</button>
<button onclick="setView('Joyitas')">💎 Joyitas</button>
<button onclick="setView('Descubrir')">🧭 A descubrir</button>
<button onclick="setView('Prestados')">↔ Va y vuelve</button>
</div>

<div class="main">
<h1 id="title">Biblioteca</h1>
<div id="list"></div>
<button onclick="addItem()">+</button>
</div>
</div>

<script>
let items = JSON.parse(localStorage.getItem("xanadu")||"[]");
let view="Biblioteca";

function save(){localStorage.setItem("xanadu",JSON.stringify(items));}

function render(){
document.getElementById("title").innerText=view;
let list=document.getElementById("list");
list.innerHTML="";

items.filter(i=>{
if(view==="Joyitas") return i.gem;
if(view==="Descubrir") return i.discover;
if(view==="Prestados") return i.loaned;
return true;
}).forEach(i=>{
let el=document.createElement("div");
el.className="card";
el.innerHTML=`
<strong>${i.title}</strong><br>
<span class="badge">${i.loanedTo? "Prestado a "+i.loanedTo:""}</span><br>
<button onclick="toggleGem('${i.id}')">💎</button>
<button onclick="toggleDiscover('${i.id}')">🧭</button>
`;
list.appendChild(el);
});
}

function addItem(){
let t=prompt("Título");
if(!t)return;
items.unshift({id:Date.now(),title:t,gem:false,discover:false,loaned:false,loanedTo:"",history:[]});
save();render();
}

function toggleGem(id){
let i=items.find(x=>x.id==id);
i.gem=!i.gem;save();render();
}

function toggleDiscover(id){
let i=items.find(x=>x.id==id);
i.discover=!i.discover;save();render();
}

function setView(v){view=v;render();}

render();
</script>
</body>
</html>
