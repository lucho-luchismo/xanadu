<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ecdcca" />
  <title>Xanadu</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{
      --bg:#efe1ce;
      --paper:#f7ecdd;
      --paper-2:#f2e5d4;
      --card:#fbf3e7;
      --ink:#3d2a1e;
      --muted:#7d6858;
      --line:rgba(112, 74, 42, .14);
      --line-strong:rgba(112, 74, 42, .24);
      --accent:#b96f34;
      --accent-deep:#8d5327;
      --accent-soft:#ecd7bf;
      --ok:#70845e;
      --danger:#9e4f3b;
      --shadow:0 16px 40px rgba(69, 42, 22, .08);
      --shadow-soft:0 10px 24px rgba(69, 42, 22, .05);
      --sidebar:286px;
      --r-xl:30px;
      --r-lg:24px;
      --r-md:18px;
      --r-sm:14px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--ink);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(255,255,255,.34), transparent 28%),
        radial-gradient(circle at 100% 10%, rgba(255,255,255,.17), transparent 20%),
        linear-gradient(180deg, #f1e4d2 0%, var(--bg) 100%);
    }

    button,input,select,textarea{font:inherit;color:inherit}
    .hidden{display:none !important}

    .app{
      min-height:100vh;
      display:grid;
      grid-template-columns:var(--sidebar) 1fr;
      gap:20px;
      padding:18px;
    }

    .sidebar,.surface,.overlay-card,.mobile-bar{
      background:
        linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,.16)),
        var(--paper);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
    }

    .sidebar{
      position:sticky;
      top:18px;
      height:calc(100vh - 36px);
      overflow:auto;
      border-radius:var(--r-xl);
      padding:22px 18px 18px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .brand-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding-bottom:8px;
      border-bottom:1px solid var(--line);
    }

    .brand{
      margin:0;
      line-height:1;
      font-size:2.2rem;
      letter-spacing:-.045em;
      font-weight:700;
    }

    .sub-brand{
      color:var(--muted);
      font-size:.92rem;
    }

    .block{display:grid;gap:10px}
    .block-title{
      margin:0;
      color:var(--muted);
      font-size:.9rem;
      font-weight:700;
      letter-spacing:.02em;
    }

    .search{
      width:100%;
      border:1px solid var(--line-strong);
      background:rgba(255,255,255,.42);
      border-radius:18px;
      padding:14px 16px;
      outline:none;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.34);
    }

    .chips{display:flex;flex-wrap:wrap;gap:10px}
    .chip{
      border:1px solid var(--line-strong);
      background:rgba(255,255,255,.36);
      border-radius:16px;
      padding:11px 14px;
      line-height:1;
      cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.28);
      transition:transform .14s ease, background .14s ease, box-shadow .14s ease;
    }
    .chip:hover{transform:translateY(-1px)}
    .chip.active{
      color:#fff9f1;
      border-color:transparent;
      background:linear-gradient(180deg, #cd7b39 0%, var(--accent) 100%);
      box-shadow:0 10px 18px rgba(185,111,52,.2);
    }

    .content{
      min-width:0;
      display:grid;
      grid-template-rows:auto 1fr;
      gap:18px;
    }

    .surface{
      border-radius:32px;
      padding:20px;
    }

    .top-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
    }
    .top-head h2{
      margin:0;
      font-size:2.35rem;
      line-height:1;
      letter-spacing:-.05em;
    }
    .top-head p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:1rem;
    }
    .count{
      color:var(--muted);
      font-size:1rem;
      padding-top:4px;
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:16px;
    }

    .ghost-btn{
      border:1px solid var(--line-strong);
      background:rgba(255,255,255,.36);
      border-radius:16px;
      padding:11px 15px;
      cursor:pointer;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
      gap:18px;
    }

    .card{
      background:
        linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.14)),
        var(--card);
      border:1px solid rgba(112,74,42,.12);
      border-radius:26px;
      overflow:hidden;
      box-shadow:var(--shadow-soft);
      transition:transform .16s ease, box-shadow .16s ease;
      cursor:pointer;
    }
    .card:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 28px rgba(69,42,22,.09);
    }

    .cover{
      aspect-ratio:.8;
      background:linear-gradient(145deg, #e6d2bc, #d9bfa2);
      display:grid;
      place-items:center;
      overflow:hidden;
      position:relative;
    }
    .cover img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .cover-placeholder{
      padding:22px;
      text-align:center;
      font-size:1.16rem;
      line-height:1.2;
      font-weight:700;
      color:#7a624d;
    }

    .card-body{
      display:grid;
      gap:8px;
      padding:16px 16px 18px;
    }

    .item-title{
      margin:0;
      font-size:1.22rem;
      line-height:1.12;
      letter-spacing:-.02em;
    }
    .item-subtitle{
      margin:-2px 0 0;
      color:var(--muted);
      font-size:.96rem;
      line-height:1.2;
    }
    .item-authors{
      margin:0;
      font-size:1rem;
      line-height:1.26;
    }

    .badge,.loan-tag,.mark-btn{
      width:fit-content;
      border-radius:999px;
      padding:6px 10px;
      line-height:1;
      font-size:.88rem;
      border:1px solid rgba(112,74,42,.14);
      background:rgba(255,255,255,.56);
    }
    .badge{font-weight:700}
    .status-badge{color:var(--accent-deep)}
    .meta,.notes,.history-preview{
      color:var(--muted);
      font-size:.95rem;
      line-height:1.28;
    }
    .loan-tag{
      color:var(--ok);
      border-color:rgba(112,132,94,.24);
      background:rgba(112,132,94,.09);
    }

    .marks-row,.bottom-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .mark-actions{display:flex;gap:8px;align-items:center}
    .mark-btn{
      cursor:pointer;
      background:transparent;
      min-width:38px;
      text-align:center;
    }
    .mark-btn.active{
      background:rgba(185,111,52,.11);
      border-color:rgba(185,111,52,.2);
      color:var(--accent-deep);
    }

    .empty{
      padding:54px 24px;
      text-align:center;
      color:var(--muted);
      border-radius:24px;
      border:1px dashed var(--line-strong);
      background:rgba(255,255,255,.14);
    }

    .fab{
      position:fixed;
      right:24px;
      bottom:22px;
      width:72px;
      height:72px;
      border:none;
      border-radius:999px;
      background:linear-gradient(180deg, #ce7a37 0%, var(--accent) 100%);
      color:#fff9f1;
      font-size:2rem;
      cursor:pointer;
      box-shadow:0 18px 34px rgba(185,111,52,.28);
      z-index:20;
    }

    .overlay{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(51,31,20,.34);
      z-index:40;
    }
    .overlay.active{display:flex}

    .overlay-card{
      width:min(860px, 100%);
      max-height:calc(100vh - 36px);
      overflow:auto;
      border-radius:34px;
      padding:22px;
    }

    .overlay-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding-bottom:12px;
      border-bottom:1px solid var(--line);
      margin-bottom:18px;
    }
    .overlay-title{
      margin:0;
      font-size:2rem;
      letter-spacing:-.03em;
    }
    .close-btn{
      border:none;
      background:transparent;
      color:var(--muted);
      font-size:1.9rem;
      line-height:1;
      cursor:pointer;
    }

    .detail-layout{
      display:grid;
      grid-template-columns:minmax(220px,270px) 1fr;
      gap:22px;
      align-items:start;
    }
    .detail-cover{
      width:100%;
      aspect-ratio:.78;
      border-radius:24px;
      overflow:hidden;
      background:linear-gradient(145deg, #e6d2bc, #d9bfa2);
      box-shadow:var(--shadow-soft);
    }
    .detail-cover img{width:100%;height:100%;object-fit:cover;display:block}
    .detail-placeholder{
      width:100%;height:100%;
      display:grid;place-items:center;
      padding:22px;text-align:center;
      color:#7a624d;font-weight:700;font-size:1.2rem;
    }
    .detail-body{display:grid;gap:12px}
    .detail-title{
      margin:0;
      font-size:2.2rem;
      line-height:1;
      letter-spacing:-.045em;
    }
    .detail-subtitle{
      margin:4px 0 0;
      color:var(--muted);
      font-size:1.08rem;
    }
    .detail-authors{
      margin:8px 0 0;
      font-size:1.08rem;
      line-height:1.3;
    }
    .detail-row{
      display:flex;
      flex-wrap:wrap;
      gap:10px 12px;
      align-items:center;
    }
    .detail-meta{
      color:var(--muted);
      font-size:1rem;
      line-height:1.35;
    }

    .detail-block{
      background:rgba(255,255,255,.28);
      border:1px solid var(--line);
      border-radius:20px;
      padding:14px 15px;
      display:grid;
      gap:8px;
    }
    .detail-block h4{
      margin:0;
      font-size:1rem;
    }

    .history-list{
      list-style:none;
      margin:0;
      padding:0;
      display:grid;
      gap:8px;
    }
    .history-item{
      padding:10px 12px;
      border-radius:14px;
      background:rgba(255,255,255,.34);
      border:1px solid var(--line);
      color:var(--muted);
    }

    .form-grid{display:grid;gap:12px}
    .row{display:grid;gap:12px}
    .row.cols-2{grid-template-columns:1fr 1fr}
    .field{display:grid;gap:8px}
    .label{
      color:var(--muted);
      font-size:.92rem;
      font-weight:700;
    }
    .input,.select,.textarea{
      width:100%;
      border:1px solid var(--line-strong);
      background:rgba(255,255,255,.45);
      border-radius:16px;
      padding:13px 14px;
      outline:none;
    }
    .textarea{min-height:90px;resize:vertical}

    .upload{
      display:grid;
      gap:10px;
      padding:14px;
      border-radius:20px;
      border:1px dashed var(--line-strong);
      background:rgba(255,255,255,.28);
    }
    .upload-preview{
      width:116px;
      aspect-ratio:.78;
      border-radius:18px;
      overflow:hidden;
      background:#e6d2bc;
      display:none;
    }
    .upload-preview img{width:100%;height:100%;object-fit:cover;display:block}

    .form-actions{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
      margin-top:4px;
    }
    .primary-btn,.secondary-btn,.danger-btn{
      border:none;
      border-radius:16px;
      padding:12px 16px;
      cursor:pointer;
    }
    .primary-btn{
      background:linear-gradient(180deg, #ce7a37 0%, var(--accent) 100%);
      color:#fff9f1;
    }
    .secondary-btn{
      background:rgba(255,255,255,.36);
      border:1px solid var(--line-strong);
    }
    .danger-btn{
      background:rgba(158,79,59,.1);
      border:1px solid rgba(158,79,59,.2);
      color:#8e4432;
    }

    .mobile-bar{
      display:none;
      position:fixed;
      left:12px;
      right:12px;
      bottom:12px;
      padding:10px;
      border-radius:22px;
      z-index:25;
      grid-template-columns:1fr 1fr auto;
      gap:8px;
      align-items:center;
    }
    .mobile-btn{
      border:1px solid var(--line-strong);
      background:rgba(255,255,255,.4);
      border-radius:15px;
      padding:12px 14px;
      cursor:pointer;
      text-align:center;
    }
    .mobile-add{
      width:48px;height:48px;
      border-radius:999px;border:none;cursor:pointer;
      background:linear-gradient(180deg, #ce7a37 0%, var(--accent) 100%);
      color:#fff9f1;font-size:1.7rem;
    }

    @media (max-width: 1020px){
      .app{grid-template-columns:1fr}
      .sidebar{display:none}
      .mobile-bar{display:grid}
      .fab{bottom:80px}
    }

    @media (max-width: 760px){
      .app{padding:12px}
      .surface,.overlay-card{padding:16px;border-radius:28px}
      .top-head{flex-direction:column}
      .grid{grid-template-columns:repeat(auto-fill, minmax(170px, 1fr))}
      .detail-layout{grid-template-columns:1fr}
      .detail-cover{max-width:270px}
      .row.cols-2{grid-template-columns:1fr}
    }

    @media (max-width: 460px){
      .grid{grid-template-columns:1fr}
      .top-head h2{font-size:2rem}
      .detail-title{font-size:1.8rem}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand-row">
        <h1 class="brand">Xanadu</h1>
        <span class="sub-brand">biblioteca local</span>
      </div>

      <div class="block">
        <input id="searchInput" class="search" placeholder="🔎  Buscar..." />
      </div>

      <div class="block">
        <p class="block-title">Vista</p>
        <div id="viewGroup" class="chips"></div>
      </div>

      <div class="block">
        <p class="block-title">Orden</p>
        <div id="sortGroup" class="chips"></div>
      </div>

      <div class="block">
        <p class="block-title">Década</p>
        <div id="decadeGroup" class="chips"></div>
      </div>

      <div class="block">
        <p class="block-title">Idioma</p>
        <div id="languageGroup" class="chips"></div>
      </div>

      <div class="block">
        <p class="block-title">Datos</p>
        <div class="chips">
          <button class="chip" type="button" id="exportBtn">Exportar</button>
          <button class="chip" type="button" id="importBtn">Importar</button>
          <input type="file" id="importFile" accept="application/json" hidden />
        </div>
      </div>
    </aside>

    <main class="content">
      <section class="surface">
        <div class="top-head">
          <div>
            <h2 id="screenTitle">Biblioteca</h2>
            <p id="screenSubtitle">Últimos añadidos primero.</p>
          </div>
          <div class="count" id="countLabel">0 ítems</div>
        </div>
        <div class="toolbar">
          <span class="chip active" id="currentViewChip">Biblioteca</span>
        </div>
      </section>

      <section class="surface">
        <div id="cardsGrid" class="grid"></div>
        <div id="emptyState" class="empty hidden">No hay ítems para mostrar con esta combinación.</div>
      </section>
    </main>
  </div>

  <button id="addBtn" class="fab" type="button" aria-label="Agregar">＋</button>

  <div class="mobile-bar">
    <button class="mobile-btn" type="button" id="mobileViewBtn">Biblioteca</button>
    <button class="mobile-btn" type="button" id="mobileSearchBtn">Buscar</button>
    <button class="mobile-add" type="button" id="mobileAddBtn">＋</button>
  </div>

  <div id="formOverlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-head">
        <h3 class="overlay-title" id="formTitle">Agregar</h3>
        <button class="close-btn" type="button" id="closeFormBtn">×</button>
      </div>

      <form id="itemForm" class="form-grid">
        <input type="hidden" id="editingId" />

        <div class="field">
          <label class="label" for="title">Título</label>
          <input class="input" id="title" required />
        </div>

        <div class="field">
          <label class="label" for="subtitle">Subtítulo</label>
          <input class="input" id="subtitle" />
        </div>

        <div class="field">
          <label class="label" for="authors">Autor/es</label>
          <input class="input" id="authors" />
        </div>

        <div class="row cols-2">
          <div class="field">
            <label class="label" for="type">Tipo</label>
            <select class="select" id="type">
              <option value="Libro">Libro</option>
              <option value="Revista">Revista</option>
              <option value="Comic">Comic</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="status">Estado</label>
            <select class="select" id="status">
              <option value="Biblioteca">Biblioteca</option>
              <option value="Va y vuelve">Va y vuelve</option>
            </select>
          </div>
        </div>

        <div class="row cols-2">
          <div class="field">
            <label class="label" for="publisher">Editorial</label>
            <input class="input" id="publisher" />
          </div>
          <div class="field">
            <label class="label" for="genre">Género</label>
            <input class="input" id="genre" />
          </div>
        </div>

        <div class="row cols-2">
          <div class="field">
            <label class="label" for="year">Año</label>
            <input class="input" id="year" inputmode="numeric" />
          </div>
          <div class="field">
            <label class="label" for="language">Idioma</label>
            <input class="input" id="language" value="Español" />
          </div>
        </div>

        <div class="field">
          <label class="label" for="guardian">Guardián</label>
          <input class="input" id="guardian" placeholder="Se completa por defecto con el último cargado" />
        </div>

        <div id="loanToField" class="field hidden">
          <label class="label" for="loanedTo">Prestado a</label>
          <input class="input" id="loanedTo" placeholder="Ej. Clara" />
        </div>

        <div class="field">
          <label class="label" for="notes">Notas</label>
          <textarea class="textarea" id="notes"></textarea>
        </div>

        <div class="upload">
          <label class="label" for="imageInput">Imagen</label>
          <input id="imageInput" type="file" accept="image/*" capture="environment" />
          <div class="meta">En celular abre cámara o galería. En desktop abre selector de archivo.</div>
          <div id="uploadPreview" class="upload-preview"><img id="previewImg" alt="Vista previa" /></div>
        </div>

        <div class="form-actions">
          <button class="secondary-btn" type="button" id="cancelFormBtn">Cancelar</button>
          <button class="primary-btn" type="submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="detailOverlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-head">
        <h3 class="overlay-title">Ítem</h3>
        <button class="close-btn" type="button" id="closeDetailBtn">×</button>
      </div>

      <div class="detail-layout">
        <div>
          <div id="detailCover" class="detail-cover"></div>
        </div>

        <div class="detail-body">
          <div>
            <h2 id="detailTitle" class="detail-title"></h2>
            <div id="detailSubtitle" class="detail-subtitle hidden"></div>
            <p id="detailAuthors" class="detail-authors"></p>
          </div>

          <div id="detailBadges" class="detail-row"></div>
          <div id="detailMeta" class="detail-meta"></div>

          <div class="detail-block">
            <h4>Notas</h4>
            <div id="detailNotes" class="detail-meta"></div>
          </div>

          <div id="detailLoanBlock" class="detail-block hidden">
            <h4>Va y vuelve</h4>
            <div id="detailLoanCurrent" class="detail-meta"></div>
            <ul id="detailHistory" class="history-list"></ul>
          </div>

          <div class="form-actions" style="justify-content:flex-start">
            <button class="secondary-btn" type="button" id="editBtn">Editar</button>
            <button class="secondary-btn" type="button" id="toggleLoanBtn">Mover a / desde va y vuelve</button>
            <button class="danger-btn" type="button" id="deleteBtn">Borrar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEYS = ["xanadu_final_rearmado_v1", "xanadu_visual_v2", "xanadu", "xanadu_web_minima_v1"];
    const VIEWS = ["Biblioteca", "Joyitas", "A descubrir", "Va y vuelve"];
    const SORTS = ["Recientes", "Año", "Autor"];
    const DECADES = ["Todas", "2020", "2010", "2000", "1990", "1980"];
    const LANGS = ["Todos", "ES", "EN", "FR", "Otros"];

    const state = {
      view: "Biblioteca",
      sort: "Recientes",
      decade: "Todas",
      language: "Todos",
      search: ""
    };

    const els = {
      viewGroup: document.getElementById("viewGroup"),
      sortGroup: document.getElementById("sortGroup"),
      decadeGroup: document.getElementById("decadeGroup"),
      languageGroup: document.getElementById("languageGroup"),
      searchInput: document.getElementById("searchInput"),
      screenTitle: document.getElementById("screenTitle"),
      screenSubtitle: document.getElementById("screenSubtitle"),
      countLabel: document.getElementById("countLabel"),
      currentViewChip: document.getElementById("currentViewChip"),
      cardsGrid: document.getElementById("cardsGrid"),
      emptyState: document.getElementById("emptyState"),
      addBtn: document.getElementById("addBtn"),
      mobileAddBtn: document.getElementById("mobileAddBtn"),
      mobileViewBtn: document.getElementById("mobileViewBtn"),
      mobileSearchBtn: document.getElementById("mobileSearchBtn"),
      exportBtn: document.getElementById("exportBtn"),
      importBtn: document.getElementById("importBtn"),
      importFile: document.getElementById("importFile"),
      formOverlay: document.getElementById("formOverlay"),
      detailOverlay: document.getElementById("detailOverlay"),
      formTitle: document.getElementById("formTitle"),
      closeFormBtn: document.getElementById("closeFormBtn"),
      cancelFormBtn: document.getElementById("cancelFormBtn"),
      itemForm: document.getElementById("itemForm"),
      editingId: document.getElementById("editingId"),
      status: document.getElementById("status"),
      loanToField: document.getElementById("loanToField"),
      loanedTo: document.getElementById("loanedTo"),
      imageInput: document.getElementById("imageInput"),
      uploadPreview: document.getElementById("uploadPreview"),
      previewImg: document.getElementById("previewImg"),
      closeDetailBtn: document.getElementById("closeDetailBtn"),
      detailCover: document.getElementById("detailCover"),
      detailTitle: document.getElementById("detailTitle"),
      detailSubtitle: document.getElementById("detailSubtitle"),
      detailAuthors: document.getElementById("detailAuthors"),
      detailBadges: document.getElementById("detailBadges"),
      detailMeta: document.getElementById("detailMeta"),
      detailNotes: document.getElementById("detailNotes"),
      detailLoanBlock: document.getElementById("detailLoanBlock"),
      detailLoanCurrent: document.getElementById("detailLoanCurrent"),
      detailHistory: document.getElementById("detailHistory"),
      editBtn: document.getElementById("editBtn"),
      toggleLoanBtn: document.getElementById("toggleLoanBtn"),
      deleteBtn: document.getElementById("deleteBtn")
    };

    let books = [];
    let lastGuardian = "";
    let pendingImage = "";
    let selectedId = null;

    function uid() {
      return "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function compact(arr) { return arr.filter(Boolean); }

    function escapeHtml(v) {
      return String(v || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function norm(v) {
      return String(v || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function decadeOf(year) {
      const n = parseInt(year, 10);
      if (!n) return "";
      return String(Math.floor(n / 10) * 10);
    }

    function languageCode(v) {
      const x = norm(v);
      if (!x) return "Otros";
      if (x.startsWith("es") || x.includes("castell")) return "ES";
      if (x.startsWith("en") || x.includes("ingles")) return "EN";
      if (x.startsWith("fr") || x.includes("frances")) return "FR";
      return "Otros";
    }

    function fmtDate(ts) {
      return new Date(ts || Date.now()).toLocaleDateString("es-AR");
    }

    function defaultBooks() {
      return [
        {
          id: uid(),
          title: "Watchmen",
          subtitle: "",
          authors: "Alan Moore y Dave Gibbons",
          type: "Comic",
          status: "Biblioteca",
          publisher: "Planeta",
          genre: "Novela gráfica",
          year: "2008",
          language: "Español",
          guardian: "Luciano",
          notes: "",
          image: "",
          isGem: false,
          discover: false,
          createdAt: Date.now() - 20000,
          loanedTo: "",
          loanHistory: []
        },
        {
          id: uid(),
          title: "1984",
          subtitle: "",
          authors: "George Orwell",
          type: "Libro",
          status: "Biblioteca",
          publisher: "Debolsillo",
          genre: "Novela",
          year: "1984",
          language: "Español",
          guardian: "Luciano",
          notes: "",
          image: "",
          isGem: false,
          discover: true,
          createdAt: Date.now() - 10000,
          loanedTo: "",
          loanHistory: []
        }
      ];
    }

    function sanitizeBook(raw) {
      const book = { ...raw };
      book.id = String(book.id || uid());
      book.title = String(book.title || "").trim();
      book.subtitle = String(book.subtitle || "").trim();
      book.authors = String(book.authors || book.author || "").trim();
      book.type = String(book.type || "Libro").trim() || "Libro";
      book.status = ["Biblioteca", "Va y vuelve"].includes(book.status) ? book.status : "Biblioteca";
      book.publisher = String(book.publisher || "").trim();
      book.genre = String(book.genre || "").trim();
      book.year = String(book.year || "").trim();
      book.language = String(book.language || "Español").trim() || "Español";
      book.guardian = String(book.guardian || "").trim();
      book.notes = String(book.notes || "").trim();
      book.image = String(book.image || book.cover || "").trim();
      book.isGem = !!book.isGem || book.status === "Joyitas";
      book.discover = !!book.discover || book.status === "A descubrir";
      book.createdAt = Number(book.createdAt || Date.now());
      book.loanedTo = String(book.loanedTo || "").trim();
      const history = Array.isArray(book.loanHistory) ? book.loanHistory : [];
      book.loanHistory = history
        .map(entry => ({
          to: String(entry.to || entry.loanedTo || "").trim(),
          date: Number(entry.date || Date.now())
        }))
        .filter(entry => entry.to);
      return book;
    }

    function loadBooks() {
      for (const key of STORAGE_KEYS) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) continue;
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed.map(sanitizeBook);
          if (Array.isArray(parsed.books)) return parsed.books.map(sanitizeBook);
        } catch {}
      }
      return defaultBooks();
    }

    function saveBooks() {
      localStorage.setItem(STORAGE_KEYS[0], JSON.stringify({ books }));
    }

    function renderChipSet(container, items, active, onSelect) {
      container.innerHTML = items.map(item => `
        <button class="chip ${item === active ? "active" : ""}" type="button" data-value="${item}">
          ${item}
        </button>
      `).join("");
      [...container.querySelectorAll("button")].forEach(btn => {
        btn.addEventListener("click", () => onSelect(btn.dataset.value));
      });
    }

    function visibleBooks() {
      let list = books.filter(book => {
        if (state.view === "Joyitas") return !!book.isGem;
        if (state.view === "A descubrir") return !!book.discover;
        if (state.view === "Va y vuelve") return book.status === "Va y vuelve";
        return book.status === "Biblioteca";
      });

      if (state.decade !== "Todas") list = list.filter(book => decadeOf(book.year) === state.decade);
      if (state.language !== "Todos") list = list.filter(book => languageCode(book.language) === state.language);
      if (state.search) {
        const q = norm(state.search);
        list = list.filter(book => norm([
          book.title, book.subtitle, book.authors, book.publisher, book.genre,
          book.language, book.guardian, book.notes, book.loanedTo, book.year
        ].join(" ")).includes(q));
      }

      list = list.slice();
      if (state.sort === "Recientes") list.sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
      if (state.sort === "Año") list.sort((a,b) => Number(b.year || 0) - Number(a.year || 0));
      if (state.sort === "Autor") list.sort((a,b) => (a.authors || "").localeCompare(b.authors || "", "es"));
      return list;
    }

    function subtitleForView() {
      if (state.view === "Joyitas") return "Selección curada manualmente.";
      if (state.view === "A descubrir") return "Libros y materiales para seguir de cerca.";
      if (state.view === "Va y vuelve") return "Ítems prestados y su memoria de circulación.";
      if (state.sort === "Año") return "Ordenados por año.";
      if (state.sort === "Autor") return "Ordenados por autor.";
      return "Últimos añadidos primero.";
    }

    function render() {
      renderChipSet(els.viewGroup, VIEWS, state.view, value => { state.view = value; render(); });
      renderChipSet(els.sortGroup, SORTS, state.sort, value => { state.sort = value; render(); });
      renderChipSet(els.decadeGroup, DECADES, state.decade, value => { state.decade = value; render(); });
      renderChipSet(els.languageGroup, LANGS, state.language, value => { state.language = value; render(); });

      const list = visibleBooks();
      els.screenTitle.textContent = state.view;
      els.screenSubtitle.textContent = subtitleForView();
      els.currentViewChip.textContent = state.view;
      els.mobileViewBtn.textContent = state.view;
      els.countLabel.textContent = `${list.length} ítem${list.length === 1 ? "" : "s"}`;

      els.cardsGrid.innerHTML = list.map(book => `
        <article class="card" data-open="${book.id}">
          <div class="cover">
            ${book.image ? `<img src="${book.image}" alt="${escapeHtml(book.title)}">` : `<div class="cover-placeholder">${escapeHtml(book.title)}</div>`}
          </div>
          <div class="card-body">
            <h3 class="item-title">${escapeHtml(book.title)}</h3>
            ${book.subtitle ? `<div class="item-subtitle">${escapeHtml(book.subtitle)}</div>` : ""}
            <p class="item-authors">${escapeHtml(book.authors || "")}</p>
            <div class="badge">${escapeHtml(book.type)}</div>
            <div class="meta">${escapeHtml(compact([book.publisher, book.year]).join(" · "))}</div>
            <div class="meta">${escapeHtml(compact([book.language, book.guardian ? `Guardián: ${book.guardian}` : ""]).join(" · "))}</div>
            ${book.loanedTo ? `<div class="loan-tag">Prestado a ${escapeHtml(book.loanedTo)}</div>` : ""}
            ${book.loanHistory && book.loanHistory.length ? `<div class="history-preview">Historial: ${escapeHtml(book.loanHistory[0].to)} · ${escapeHtml(fmtDate(book.loanHistory[0].date))}</div>` : ""}
            <div class="bottom-row">
              <div class="mark-actions">
                <button type="button" class="mark-btn ${book.isGem ? "active" : ""}" data-gem="${book.id}">💎</button>
                <button type="button" class="mark-btn ${book.discover ? "active" : ""}" data-discover="${book.id}">🧭</button>
              </div>
              <div class="badge status-badge">${escapeHtml(book.status)}</div>
            </div>
          </div>
        </article>
      `).join("");

      els.emptyState.classList.toggle("hidden", list.length > 0);
      bindCardEvents();
      saveBooks();
    }

    function bindCardEvents() {
      [...document.querySelectorAll("[data-open]")].forEach(card => {
        card.addEventListener("click", e => {
          if (e.target.closest("[data-gem]") || e.target.closest("[data-discover]")) return;
          openDetail(card.dataset.open);
        });
      });

      [...document.querySelectorAll("[data-gem]")].forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          const book = books.find(b => b.id === btn.dataset.gem);
          if (!book) return;
          if (!book.isGem && books.filter(x => x.isGem).length >= 12) {
            alert("Joyitas tiene un límite blando de 12. Sacá una antes de agregar otra.");
            return;
          }
          book.isGem = !book.isGem;
          render();
        });
      });

      [...document.querySelectorAll("[data-discover]")].forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          const book = books.find(b => b.id === btn.dataset.discover);
          if (!book) return;
          book.discover = !book.discover;
          render();
        });
      });
    }

    function setValue(id, value) {
      document.getElementById(id).value = value || "";
    }

    function toggleLoanField() {
      els.loanToField.classList.toggle("hidden", els.status.value !== "Va y vuelve");
    }

    function openForm(book = null) {
      els.formOverlay.classList.add("active");
      if (!book) {
        els.formTitle.textContent = "Agregar";
        els.itemForm.reset();
        els.editingId.value = "";
        document.getElementById("language").value = "Español";
        document.getElementById("guardian").value = lastGuardian || "";
        els.status.value = "Biblioteca";
        pendingImage = "";
        els.uploadPreview.style.display = "none";
        toggleLoanField();
        return;
      }
      els.formTitle.textContent = "Editar";
      els.editingId.value = book.id;
      setValue("title", book.title);
      setValue("subtitle", book.subtitle);
      setValue("authors", book.authors);
      setValue("type", book.type);
      setValue("status", book.status);
      setValue("publisher", book.publisher);
      setValue("genre", book.genre);
      setValue("year", book.year);
      setValue("language", book.language || "Español");
      setValue("guardian", book.guardian || lastGuardian || "");
      setValue("loanedTo", book.loanedTo || "");
      setValue("notes", book.notes);
      pendingImage = book.image || "";
      if (pendingImage) {
        els.previewImg.src = pendingImage;
        els.uploadPreview.style.display = "block";
      } else {
        els.uploadPreview.style.display = "none";
      }
      toggleLoanField();
    }

    function closeForm() {
      els.formOverlay.classList.remove("active");
    }

    function closeDetail() {
      els.detailOverlay.classList.remove("active");
      selectedId = null;
    }

    function openDetail(id) {
      const book = books.find(b => b.id === id);
      if (!book) return;
      selectedId = id;
      els.detailOverlay.classList.add("active");

      els.detailCover.innerHTML = book.image
        ? `<img src="${book.image}" alt="${escapeHtml(book.title)}">`
        : `<div class="detail-placeholder">${escapeHtml(book.title)}</div>`;

      els.detailTitle.textContent = book.title || "";
      if (book.subtitle) {
        els.detailSubtitle.textContent = book.subtitle;
        els.detailSubtitle.classList.remove("hidden");
      } else {
        els.detailSubtitle.classList.add("hidden");
      }
      els.detailAuthors.textContent = book.authors || "";

      els.detailBadges.innerHTML = `
        <span class="badge">${escapeHtml(book.type)}</span>
        ${book.isGem ? `<span class="badge status-badge">💎 Joyita</span>` : ""}
        ${book.discover ? `<span class="badge status-badge">🧭 A descubrir</span>` : ""}
        <span class="badge status-badge">${escapeHtml(book.status)}</span>
      `;

      els.detailMeta.textContent = compact([
        book.publisher, book.genre, book.year, book.language,
        book.guardian ? `Guardián: ${book.guardian}` : ""
      ]).join(" · ");

      els.detailNotes.textContent = book.notes || "Sin notas.";

      const showLoanBlock = (book.loanHistory && book.loanHistory.length) || book.status === "Va y vuelve" || book.loanedTo;
      els.detailLoanBlock.classList.toggle("hidden", !showLoanBlock);
      els.detailLoanCurrent.textContent = book.status === "Va y vuelve"
        ? (book.loanedTo ? `Actualmente prestado a ${book.loanedTo}.` : "Está en va y vuelve, sin destinatario cargado.")
        : "Actualmente no está prestado.";
      els.detailHistory.innerHTML = (book.loanHistory && book.loanHistory.length)
        ? book.loanHistory.map(entry => `<li class="history-item">${escapeHtml(entry.to)} · ${escapeHtml(fmtDate(entry.date))}</li>`).join("")
        : `<li class="history-item">Sin historial todavía.</li>`;
    }

    function addLoanHistory(book, to) {
      if (!to) return;
      if (!Array.isArray(book.loanHistory)) book.loanHistory = [];
      book.loanHistory.unshift({ to, date: Date.now() });
    }

    function toggleLoanFromDetail() {
      const book = books.find(b => b.id === selectedId);
      if (!book) return;
      if (book.status === "Va y vuelve") {
        book.status = "Biblioteca";
        book.loanedTo = "";
      } else {
        const to = prompt("¿A quién se presta?");
        if (to === null) return;
        const clean = to.trim();
        book.status = "Va y vuelve";
        book.loanedTo = clean;
        addLoanHistory(book, clean);
      }
      render();
      openDetail(book.id);
    }

    function deleteSelected() {
      const book = books.find(b => b.id === selectedId);
      if (!book) return;
      if (!confirm(`¿Borrar "${book.title}"?`)) return;
      books = books.filter(b => b.id !== selectedId);
      closeDetail();
      render();
    }

    async function fileToDataURL(file) {
      return await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    els.imageInput.addEventListener("change", async e => {
      const file = e.target.files?.[0];
      if (!file) return;
      pendingImage = await fileToDataURL(file);
      els.previewImg.src = pendingImage;
      els.uploadPreview.style.display = "block";
    });

    els.status.addEventListener("change", toggleLoanField);

    els.itemForm.addEventListener("submit", e => {
      e.preventDefault();
      const existing = books.find(b => b.id === els.editingId.value);
      const status = els.status.value;
      const loanedTo = (els.loanedTo.value || "").trim();
      const book = existing ? { ...existing } : { id: uid(), isGem: false, discover: false, loanHistory: [], createdAt: Date.now() };

      book.title = document.getElementById("title").value.trim();
      book.subtitle = document.getElementById("subtitle").value.trim();
      book.authors = document.getElementById("authors").value.trim();
      book.type = document.getElementById("type").value;
      book.status = status;
      book.publisher = document.getElementById("publisher").value.trim();
      book.genre = document.getElementById("genre").value.trim();
      book.year = document.getElementById("year").value.trim();
      book.language = document.getElementById("language").value.trim() || "Español";
      book.guardian = document.getElementById("guardian").value.trim() || lastGuardian || "";
      book.notes = document.getElementById("notes").value.trim();
      book.image = pendingImage || existing?.image || "";

      const prevStatus = existing?.status || "";
      const prevLoanedTo = existing?.loanedTo || "";

      if (status === "Va y vuelve") {
        book.loanedTo = loanedTo;
        if ((!existing && loanedTo) || (prevStatus !== "Va y vuelve" && loanedTo) || (prevStatus === "Va y vuelve" && loanedTo && loanedTo !== prevLoanedTo)) {
          addLoanHistory(book, loanedTo);
        }
      } else {
        book.loanedTo = "";
      }

      if (!book.title) return;

      lastGuardian = book.guardian || lastGuardian;

      if (existing) {
        books = books.map(b => b.id === book.id ? sanitizeBook(book) : b);
      } else {
        books.unshift(sanitizeBook(book));
      }

      closeForm();
      render();
      if (selectedId === book.id) openDetail(book.id);
    });

    els.addBtn.addEventListener("click", () => openForm());
    els.mobileAddBtn.addEventListener("click", () => openForm());
    els.closeFormBtn.addEventListener("click", closeForm);
    els.cancelFormBtn.addEventListener("click", closeForm);

    els.closeDetailBtn.addEventListener("click", closeDetail);
    els.editBtn.addEventListener("click", () => {
      const book = books.find(b => b.id === selectedId);
      if (!book) return;
      closeDetail();
      openForm(book);
    });
    els.toggleLoanBtn.addEventListener("click", toggleLoanFromDetail);
    els.deleteBtn.addEventListener("click", deleteSelected);

    els.searchInput.addEventListener("input", e => {
      state.search = e.target.value;
      render();
    });

    els.mobileSearchBtn.addEventListener("click", () => {
      els.searchInput.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    els.mobileViewBtn.addEventListener("click", () => {
      const idx = VIEWS.indexOf(state.view);
      state.view = VIEWS[(idx + 1) % VIEWS.length];
      render();
    });

    els.exportBtn.addEventListener("click", () => {
      const payload = { books, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "xanadu-export.json";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    els.importBtn.addEventListener("click", () => els.importFile.click());
    els.importFile.addEventListener("change", async e => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        const imported = Array.isArray(data) ? data : data.books;
        if (!Array.isArray(imported)) throw new Error("Formato inválido");
        books = imported.map(sanitizeBook).filter(book => book.title);
        saveBooks();
        render();
      } catch (err) {
        alert("No se pudo importar el JSON.");
      }
      e.target.value = "";
    });

    window.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        closeForm();
        closeDetail();
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }

    books = loadBooks();
    lastGuardian = books.map(b => b.guardian).filter(Boolean).pop() || "";
    render();
  </script>
</body>
</html>
